<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat Offline UI - Enhanced</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === RESET & VARIABEL === */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --user-msg: linear-gradient(135deg, #007AFF, #0056b3);
            --ai-msg: rgba(30, 30, 30, 0.6);
            --text-color: #ffffff;
            --body-bg: #121212;
        }
        body.light-mode {
            --glass-bg: rgba(0, 0, 0, 0.05);
            --glass-border: rgba(0, 0, 0, 0.1);
            --ai-msg: rgba(240, 240, 240, 0.8);
            --text-color: #000000;
            --body-bg: #f5f5f5;
        }

        /* === BODY & CONTAINER === */
        body {
            background-color: var(--body-bg);
            background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1080&auto=format&fit=crop'); /* Default BG */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
        }

        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* === HEADER === */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            color: var(--text-color);
            z-index: 10;
        }
        .header-title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.1rem; }
        .ai-avatar { width: 35px; height: 35px; background: var(--user-msg); border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .header-icons { display: flex; gap: 15px; }
        .header-icons i { cursor: pointer; font-size: 1.2rem; transition: 0.3s; }
        .header-icons i:hover { color: #007AFF; }

        /* === CHAT AREA === */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scrollbar-width: none;
        }
        .chat-box::-webkit-scrollbar { display: none; }

        /* === PESAN BUBBLE === */
        .message-wrapper {
            position: relative;
            max-width: 80%;
            align-self: flex-start;
            margin-bottom: 5px;
        }
        .message-wrapper.user-wrapper {
            align-self: flex-end;
        }
        .message {
            padding: 12px 16px;
            border-radius: 20px;
            color: var(--text-color);
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeInSlideUp 0.3s ease forwards;
            word-wrap: break-word;
            transition: box-shadow 0.2s;
        }
        .message.user {
            background: var(--user-msg);
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
        }
        .message.ai {
            background: var(--ai-msg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }
        .message.sticker {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            font-size: 4rem;
            padding: 0;
            animation: stickerBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Tombol hapus dan edit (hanya muncul saat hover) */
        .message-actions {
            position: absolute;
            top: -10px;
            right: 0;
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 2px 5px;
            backdrop-filter: blur(5px);
            z-index: 5;
        }
        .message-wrapper:hover .message-actions {
            opacity: 1;
        }
        .message-actions i {
            color: white;
            font-size: 0.8rem;
            padding: 3px;
            cursor: pointer;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
        }
        .message-actions i:hover {
            background: #007AFF;
        }

        /* Tombol text-to-speech khusus AI */
        .tts-button {
            margin-left: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            background: none;
            border: none;
            color: var(--text-color);
            opacity: 0.6;
        }
        .tts-button:hover {
            opacity: 1;
        }

        /* Gambar dalam pesan */
        .message img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 5px;
        }

        /* === TYPING INDICATOR === */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 15px 20px;
            background: var(--ai-msg);
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            width: fit-content;
            align-self: flex-start;
            display: none;
        }
        .dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        /* === INPUT AREA === */
        .input-area {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--glass-border);
            gap: 10px;
        }
        .btn-icon {
            background: none; border: none; color: var(--text-color); font-size: 1.4rem; cursor: pointer; transition: 0.2s;
        }
        .btn-icon:hover { color: #007AFF; }
        .input-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            padding: 12px 15px;
            border-radius: 25px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .input-box::placeholder { color: #aaa; }
        
        .btn-mic.recording {
            color: #ff3b30;
            animation: pulseMic 1s infinite;
        }
        .btn-send {
            background: var(--user-msg); border: none; width: 40px; height: 40px; border-radius: 50%; color: #fff; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.2s;
        }
        .btn-send:active { transform: scale(0.9); }

        /* === STICKER PANEL === */
        .sticker-panel {
            height: 0;
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(10px);
            transition: height 0.3s ease;
            display: flex;
            justify-content: space-around;
            align-items: center;
            overflow: hidden;
            border-top: 1px solid var(--glass-border);
        }
        .sticker-panel.active { height: 80px; padding: 10px; }
        .sticker-item { font-size: 2.5rem; cursor: pointer; transition: transform 0.2s; }
        .sticker-item:hover { transform: scale(1.2); }

        /* Input File Hidden */
        #bg-upload, #img-upload { display: none; }

        /* === ANIMATIONS === */
        @keyframes fadeInSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        @keyframes pulseMic {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); border-radius: 50%;}
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(255, 59, 48, 0); border-radius: 50%;}
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); border-radius: 50%;}
        }
        @keyframes stickerBounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <header>
            <div class="header-title">
                <div class="ai-avatar"><i class="fa-solid fa-robot"></i></div>
                <div>
                    <div>Local LLM</div>
                    <div style="font-size: 0.7rem; color: #4cd964; font-weight: normal;">● Online (Offline Mode)</div>
                </div>
            </div>
            <div class="header-icons">
                <i class="fa-solid fa-image" id="btn-wallpaper" title="Ganti Wallpaper"></i>
                <i class="fa-solid fa-expand" id="btn-bg-size" title="Ubah Ukuran Gambar"></i>
                <i class="fa-solid fa-trash-can" id="btn-clear" title="Hapus Semua Chat"></i>
                <i class="fa-solid fa-paint-brush" id="btn-theme" title="Ganti Tema"></i>
                <i class="fa-solid fa-cloud-upload-alt" id="btn-upload-image" title="Kirim Gambar"></i>
            </div>
        </header>

        <main class="chat-box" id="chat-box">
            <!-- Pesan akan dimuat dari localStorage saat inisialisasi -->
            <div class="typing-indicator" id="typing-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </main>

        <div class="sticker-panel" id="sticker-panel">
            <div class="sticker-item" data-sticker="🚀">🚀</div>
            <div class="sticker-item" data-sticker="🔥">🔥</div>
            <div class="sticker-item" data-sticker="😂">😂</div>
            <div class="sticker-item" data-sticker="😎">😎</div>
            <div class="sticker-item" data-sticker="💡">💡</div>
        </div>

        <footer>
            <div class="input-area">
                <button class="btn-icon" id="btn-sticker"><i class="fa-regular fa-face-smile"></i></button>
                <input type="text" class="input-box" id="msg-input" placeholder="Ketik pesan..." autocomplete="off">
                <button class="btn-icon btn-mic" id="btn-mic"><i class="fa-solid fa-microphone"></i></button>
                <button class="btn-send" id="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </footer>
    </div>

    <input type="file" id="bg-upload" accept="image/*">
    <input type="file" id="img-upload" accept="image/*">

    <script>
        (function() {
            // === ELEMENT SELECTIONS ===
            const chatBox = document.getElementById('chat-box');
            const msgInput = document.getElementById('msg-input');
            const btnSend = document.getElementById('btn-send');
            const typingIndicator = document.getElementById('typing-indicator');
            const btnMic = document.getElementById('btn-mic');
            const btnSticker = document.getElementById('btn-sticker');
            const stickerPanel = document.getElementById('sticker-panel');
            const bgUpload = document.getElementById('bg-upload');
            const btnWallpaper = document.getElementById('btn-wallpaper');
            const btnBgSize = document.getElementById('btn-bg-size');
            const btnClear = document.getElementById('btn-clear');
            const btnTheme = document.getElementById('btn-theme');
            const btnUploadImage = document.getElementById('btn-upload-image');
            const imgUpload = document.getElementById('img-upload');

            // === VARIABEL GLOBAL ===
            let isRecording = false;
            let isEditing = false; // untuk menandai sedang dalam mode edit
            let editTarget = null;   // elemen yang sedang diedit

            // === FUNGSI UTILITAS ===
            function scrollToBottom() {
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function showTypingIndicator() {
                typingIndicator.style.display = 'flex';
                scrollToBottom();
            }

            function hideTypingIndicator() {
                typingIndicator.style.display = 'none';
            }

            // === FUNGSI MENYIMPAN DAN MEMUAT CHAT DARI LOCALSTORAGE ===
            function saveMessages() {
                const messages = [];
                const wrappers = chatBox.querySelectorAll('.message-wrapper');
                wrappers.forEach(wrapper => {
                    const messageDiv = wrapper.querySelector('.message');
                    if (!messageDiv) return;
                    const sender = messageDiv.classList.contains('user') ? 'user' : 'ai';
                    const isSticker = messageDiv.classList.contains('sticker');
                    let content = messageDiv.innerText;
                    // Jika ada gambar, simpan juga src-nya (asumsi hanya satu gambar per pesan)
                    const img = messageDiv.querySelector('img');
                    const imgSrc = img ? img.src : null;
                    messages.push({
                        sender,
                        content,
                        isSticker,
                        imgSrc
                    });
                });
                localStorage.setItem('chatHistory', JSON.stringify(messages));
            }

            function loadMessages() {
                const saved = localStorage.getItem('chatHistory');
                if (saved) {
                    try {
                        const messages = JSON.parse(saved);
                        messages.forEach(msg => {
                            if (msg.imgSrc) {
                                appendImageMessage(msg.imgSrc, msg.sender);
                            } else {
                                appendMessage(msg.content, msg.sender, msg.isSticker);
                            }
                        });
                    } catch (e) {
                        console.error('Gagal memuat chat history', e);
                    }
                } else {
                    // Pesan sambutan default
                    appendMessage("Halo! Aku antarmuka AI-mu. Silakan hubungkan aku ke model LLM offline-mu. Ada yang bisa kubantu hari ini?", 'ai', false);
                }
            }

            // === FUNGSI MENAMBAH BUBBLE CHAT KE LAYAR (dengan wrapper) ===
            function appendMessage(content, sender, isSticker = false) {
                const wrapper = document.createElement('div');
                wrapper.classList.add('message-wrapper', sender + '-wrapper');

                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message', sender);
                if (isSticker) msgDiv.classList.add('sticker');
                msgDiv.innerText = content;

                // Tambahkan tombol aksi (hapus, edit, tts)
                const actions = document.createElement('div');
                actions.classList.add('message-actions');

                // Tombol hapus
                const deleteBtn = document.createElement('i');
                deleteBtn.className = 'fa-solid fa-trash-can';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    wrapper.remove();
                    saveMessages();
                });
                actions.appendChild(deleteBtn);

                // Tombol edit hanya untuk user
                if (sender === 'user' && !isSticker) {
                    const editBtn = document.createElement('i');
                    editBtn.className = 'fa-solid fa-pen';
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // Mode edit: ganti input dengan teks pesan
                        const newText = prompt('Edit pesan:', msgDiv.innerText);
                        if (newText !== null && newText.trim() !== '') {
                            msgDiv.innerText = newText.trim();
                            saveMessages();
                        }
                    });
                    actions.appendChild(editBtn);
                }

                // Tombol text-to-speech hanya untuk AI (dan bukan stiker)
                if (sender === 'ai' && !isSticker) {
                    const ttsBtn = document.createElement('i');
                    ttsBtn.className = 'fa-solid fa-volume-high';
                    ttsBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // Gunakan Web Speech API
                        if ('speechSynthesis' in window) {
                            const utterance = new SpeechSynthesisUtterance(msgDiv.innerText);
                            utterance.lang = 'id-ID';
                            window.speechSynthesis.speak(utterance);
                        } else {
                            alert('Browser tidak mendukung text-to-speech.');
                        }
                    });
                    actions.appendChild(ttsBtn);
                }

                wrapper.appendChild(msgDiv);
                wrapper.appendChild(actions);
                chatBox.insertBefore(wrapper, typingIndicator);

                scrollToBottom();
                saveMessages();
            }

            // Fungsi khusus untuk mengirim gambar
            function appendImageMessage(src, sender) {
                const wrapper = document.createElement('div');
                wrapper.classList.add('message-wrapper', sender + '-wrapper');

                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message', sender);
                const img = document.createElement('img');
                img.src = src;
                img.alt = 'Gambar';
                msgDiv.appendChild(img);

                const actions = document.createElement('div');
                actions.classList.add('message-actions');
                const deleteBtn = document.createElement('i');
                deleteBtn.className = 'fa-solid fa-trash-can';
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    wrapper.remove();
                    saveMessages();
                });
                actions.appendChild(deleteBtn);

                wrapper.appendChild(msgDiv);
                wrapper.appendChild(actions);
                chatBox.insertBefore(wrapper, typingIndicator);

                scrollToBottom();
                saveMessages();
            }

            // === FUNGSI MENGIRIM PESAN TEKS ===
            function sendMessage() {
                const text = msgInput.value.trim();
                if (!text) return;

                // Jika sedang dalam mode edit, kita tidak pakai di sini
                appendMessage(text, 'user', false);
                msgInput.value = '';

                // Tampilkan indikator mengetik AI
                showTypingIndicator();

                // Simulasi balasan AI
                setTimeout(() => {
                    hideTypingIndicator();
                    const aiResponses = ["Menarik sekali!", "Aku mengerti maksudmu.", "Tentu, aku bisa membantu soal itu.", "Bisa jelaskan lebih detail?", "Sistem offline beroperasi dengan baik ⚙️"];
                    const randomReply = aiResponses[Math.floor(Math.random() * aiResponses.length)];
                    appendMessage(randomReply, 'ai', false);
                }, 1500);
            }

            // === EVENT LISTENERS ===
            btnSend.addEventListener('click', sendMessage);
            msgInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            // === STIKER ===
            btnSticker.addEventListener('click', () => {
                stickerPanel.classList.toggle('active');
            });

            document.querySelectorAll('.sticker-item').forEach(item => {
                item.addEventListener('click', function() {
                    const emoji = this.getAttribute('data-sticker');
                    appendMessage(emoji, 'user', true);
                    stickerPanel.classList.remove('active');

                    // Simulasi AI balas stiker
                    showTypingIndicator();
                    setTimeout(() => {
                        hideTypingIndicator();
                        appendMessage('🤖👍', 'ai', true);
                    }, 1000);
                });
            });

            // === MIC (SIMULASI) ===
            btnMic.addEventListener('click', () => {
                isRecording = !isRecording;
                if (isRecording) {
                    btnMic.classList.add('recording');
                    msgInput.placeholder = "Mendengarkan...";
                } else {
                    btnMic.classList.remove('recording');
                    msgInput.placeholder = "Ketik pesan...";
                    msgInput.value = "Ini adalah hasil dari input suara.";
                }
            });

            // === GANTI WALLPAPER ===
            btnWallpaper.addEventListener('click', () => bgUpload.click());
            bgUpload.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.body.style.backgroundImage = `url(${e.target.result})`;
                    }
                    reader.readAsDataURL(file);
                }
            });

            // === TOGGLE UKURAN BACKGROUND ===
            let bgIsCover = true;
            btnBgSize.addEventListener('click', () => {
                bgIsCover = !bgIsCover;
                document.body.style.backgroundSize = bgIsCover ? 'cover' : 'contain';
                document.body.style.backgroundRepeat = bgIsCover ? 'initial' : 'no-repeat';
            });

            // === HAPUS SEMUA CHAT (kecuali mungkin pesan sambutan) ===
            btnClear.addEventListener('click', () => {
                if (confirm("Apakah kamu yakin ingin menghapus semua riwayat chat?")) {
                    const wrappers = chatBox.querySelectorAll('.message-wrapper');
                    wrappers.forEach(w => w.remove());
                    // Tambahkan pesan sambutan jika ingin
                    appendMessage("Halo! Aku antarmuka AI-mu. Silakan hubungkan aku ke model LLM offline-mu. Ada yang bisa kubantu hari ini?", 'ai', false);
                }
            });

            // === TOGGLE TEMA (LIGHT/DARK) ===
            btnTheme.addEventListener('click', () => {
                document.body.classList.toggle('light-mode');
            });

            // === UPLOAD GAMBAR ===
            btnUploadImage.addEventListener('click', () => imgUpload.click());
            imgUpload.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        appendImageMessage(e.target.result, 'user');
                        // Simulasi balasan AI
                        showTypingIndicator();
                        setTimeout(() => {
                            hideTypingIndicator();
                            appendMessage("Gambar diterima! Keren!", 'ai', false);
                        }, 1500);
                    };
                    reader.readAsDataURL(file);
                }
                this.value = ''; // reset input
            });

            // === LOAD CHAT DARI LOCALSTORAGE SAAT PERTAMA KALI ===
            loadMessages();

            // === FITUR EDIT DENGAN DOUBLE CLICK (ALTERNATIF) ===
            // Bisa juga menggunakan double klik pada pesan user untuk mengedit
            chatBox.addEventListener('dblclick', (e) => {
                const target = e.target.closest('.message.user');
                if (target && !target.classList.contains('sticker')) {
                    const newText = prompt('Edit pesan:', target.innerText);
                    if (newText !== null && newText.trim() !== '') {
                        target.innerText = newText.trim();
                        saveMessages();
                    }
                }
            });
        })();
    </script>
</body>
</html>
